<!-- Sidebar Overlay (Mobile) -->
<div 
  *ngIf="isOpen" 
  class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
  (click)="isOpen = false"
></div>

<!-- Sidebar -->
<aside 
  class="fixed top-0 left-0 h-full w-72 bg-gradient-to-b from-slate-900 via-gray-900 to-slate-900 border-r border-gray-700 shadow-2xl z-50 transform transition-transform duration-300 ease-in-out"
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
>
  <!-- Sidebar Header -->
  <div class="flex items-center justify-between p-6 border-b border-gray-700">
    <div class="flex items-center space-x-3">
      <img src="assets/images/dreambuild-logo.png" alt="PC Builder Logo" class="w-8 h-8">
      <span class="text-white text-xl font-bold">Builder</span>
    </div>
    <button 
      (click)="isOpen = false"
      class="lg:hidden text-gray-400 hover:text-white transition-colors p-1"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 overflow-y-auto py-6">
    <div class="px-4 space-y-2">
      <div *ngFor="let item of menuItems" class="group">
        <!-- Main Menu Item -->
        <div class="relative">
          <a 
            *ngIf="!item.submenu; else submenuTrigger"
            [routerLink]="item.route"
            routerLinkActive="bg-gradient-to-r from-cyan-500/20 to-purple-600/20 border-r-2 border-cyan-400"
            class="flex items-center px-4 py-3 text-gray-300 hover:text-white hover:bg-gray-800/50 rounded-lg transition-all duration-200 group-hover:translate-x-1"
          >
            <span class="text-xl mr-3">{{ item.icon }}</span>
            <span class="font-medium">{{ item.label }}</span>
          </a>

          <ng-template #submenuTrigger>
            <button
              (click)="toggleSubmenu(item.label)"
              class="w-full flex items-center justify-between px-4 py-3 text-gray-300 hover:text-white hover:bg-gray-800/50 rounded-lg transition-all duration-200 group-hover:translate-x-1"
              [class.bg-gray-800/30]="isExpanded(item.label)"
            >
              <div class="flex items-center">
                <span class="text-xl mr-3">{{ item.icon }}</span>
                <span class="font-medium">{{ item.label }}</span>
              </div>
              <svg 
                class="w-4 h-4 transition-transform duration-200"
                [class.rotate-180]="isExpanded(item.label)"
                fill="none" 
                stroke="currentColor" 
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>
          </ng-template>
        </div>

        <!-- Submenu -->
        <div 
          *ngIf="item.submenu && isExpanded(item.label)"
          class="ml-6 mt-2 space-y-1 animate-slideDown"
        >
          <a 
            *ngFor="let subItem of item.submenu"
            [routerLink]="subItem.route"
            class="block px-4 py-2 text-sm text-gray-400 hover:text-cyan-300 hover:bg-gray-800/30 rounded-md transition-all duration-200 border-l-2 border-transparent hover:border-cyan-400"
          >
            {{ subItem.label }}
          </a>
        </div>
      </div>
    </div>

    <!-- User Section -->
    <div class="mt-8 px-4 pt-6 border-t border-gray-700">
      <div class="space-y-2">
        <a 
          routerLink="/login"
          class="flex items-center px-4 py-3 text-gray-300 hover:text-white hover:bg-gray-800/50 rounded-lg transition-all duration-200"
        >
          <span class="text-xl mr-3">👤</span>
          <span class="font-medium">Login</span>
        </a>
        <a 
          routerLink="/register"
          class="flex items-center px-4 py-3 text-gray-300 hover:text-white hover:bg-gradient-to-r hover:from-cyan-500/20 hover:to-purple-600/20 rounded-lg transition-all duration-200"
        >
          <span class="text-xl mr-3">📝</span>
          <span class="font-medium">Register</span>
        </a>
      </div>
    </div>

    <!-- Footer Info -->
    <div class="mt-8 px-6 py-4 text-center border-t border-gray-700">
      <div class="text-xs text-gray-500 space-y-1">
        <div>PC Builder Pro</div>
        <div>Version 2.1.0</div>
        <div class="flex items-center justify-center space-x-1 mt-2">
          <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
          <span class="text-green-400">Online</span>
        </div>
      </div>
    </div>
  </nav>
</aside>
