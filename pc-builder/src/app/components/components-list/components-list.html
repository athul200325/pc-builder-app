<app-header></app-header>

<div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-8">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-4xl font-bold text-white mb-2">PC Components</h1>
    <p class="text-gray-400">Browse our extensive collection of high-quality PC components</p>
  </div>

  <!-- Search -->
  <div class="mb-8">
    <input 
      pInputText 
      placeholder="Search components..." 
      [(ngModel)]="searchTerm"
      class="w-full max-w-md">
  </div>

  <!-- Categories -->
  <div class="flex gap-4 mb-8">
    <button 
      class="bg-slate-800/60 backdrop-blur-sm border border-gray-700 rounded-lg text-center hover:border-cyan-500 transition-colors flex-shrink-0 w-16 h-28 flex items-center justify-center text-white text-2xl"
      (click)="scrollLeft()">
      ←
    </button>
    
    <div 
      id="categories-container"
      class="flex gap-4 overflow-x-auto scrollbar-hide flex-1"
      style="scrollbar-width: none; -ms-overflow-style: none;">
      
      <div 
           class="bg-slate-800/60 backdrop-blur-sm border border-gray-700 rounded-lg p-4 text-center hover:border-cyan-500 transition-colors cursor-pointer flex-shrink-0 w-32 h-28"
           (click)="allComponents()">
        <div class="text-3xl mb-2">🔧</div>
        <h3 class="text-white font-medium text-sm">All Components</h3>
      </div>

      <div *ngFor="let category of categories" 
           class="bg-slate-800/60 backdrop-blur-sm border border-gray-700 rounded-lg p-4 text-center hover:border-cyan-500 transition-colors cursor-pointer flex-shrink-0 w-32 h-28"
           [class.border-cyan-500]="selectedCategory === category.name"
           (click)="filterByCategory(category.name)">
        <div class="text-3xl mb-2">{{ category.icon }}</div>
        <h3 class="text-white font-medium text-sm">{{ category.name }}</h3>
        <p class="text-gray-400 text-xs">{{ category.count }} items</p>
      </div>
    </div>
    
    <button 
      class="bg-slate-800/60 backdrop-blur-sm border border-gray-700 rounded-lg text-center hover:border-cyan-500 transition-colors flex-shrink-0 w-16 h-28 flex items-center justify-center text-white text-2xl"
      (click)="scrollRight()">
      →
    </button>
  </div>

  <!-- Components Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <p-card *ngFor="let component of filteredComponents">
      <div class="space-y-3">
        <div>
          <h3 class="text-white font-semibold text-lg mb-1">{{ component.name }}</h3>
          <p-tag [value]="component.category" severity="info"></p-tag>
        </div>

        <div class="flex items-center gap-2">
          <p-rating [(ngModel)]="component.rating" [readonly]="true"></p-rating>
          <span class="text-gray-400 text-sm">({{ component.reviews }})</span>
        </div>

        <div class="flex items-center justify-between pt-2">
          <span class="text-2xl font-bold text-cyan-400">${{ component.price }}</span>
          <p-button 
            icon="pi pi-plus" 
            label="Add" 
            size="small" 
            [disabled]="!component.inStock">
          </p-button>
        </div>

        <p-tag 
          [value]="getStockText(component.inStock)"
          [severity]="getSeverity(component.inStock)"
          class="w-full">
        </p-tag>
      </div>
    </p-card>
  </div>
</div>

<app-footer></app-footer>
